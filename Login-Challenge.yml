info:
  name: Login/Challenge
  type: http
  seq: 1

http:
  method: POST
  url: https://api.protectedpdf.com/api/2.0/Login/Challenge
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: X-VITR-ACCOUNT-TOKEN
      value: "{{VITR_ACCOUNT_TOKEN}}"
    - name: X-VITR-SESSION-TOKEN
      value: "{{VITR_SESSION_TOKEN}}"
  body:
    type: json
    data: |-
      {
        "ClientNonce": "{{ClientNonce}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: "function createGuid() {\r

        \    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {\r

        \        const r = (Math.random() * 16) | 0;\r

        \        const v = c === 'x' ? r : (r & 0x3 | 0x8);\r

        \        return v.toString(16);\r

        \    });\r

        }\r

        \r

        // Generate and store ClientNonce\r

        const clientNonce = createGuid();\r

        bru.setEnvVar(\"ClientNonce\", clientNonce);\r

        console.log(\"Generated ClientNonce:\", clientNonce);"
    - type: after-response
      code: "const response = res.getBody();\r

        bru.setEnvVar(\"ServerNonce\", response.ServerNonce);\r

        console.log(\"Received ServerNonce:\", response.ServerNonce);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
